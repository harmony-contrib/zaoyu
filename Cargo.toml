[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.21.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
photocraft-engine = { git = "https://github.com/harmony-contrib/photocraft.git", rev = "7dfa6098138eeb5a62e60184816ff6495dd942cf" }
photocraft-ui-egui = { git = "https://github.com/harmony-contrib/photocraft.git", rev = "7dfa6098138eeb5a62e60184816ff6495dd942cf" }
photocraft-doc = { git = "https://github.com/harmony-contrib/photocraft.git", rev = "7dfa6098138eeb5a62e60184816ff6495dd942cf" }
photocraft-raster = { git = "https://github.com/harmony-contrib/photocraft.git", rev = "7dfa6098138eeb5a62e60184816ff6495dd942cf" }
photocraft-cms = { git = "https://github.com/harmony-contrib/photocraft.git", rev = "7dfa6098138eeb5a62e60184816ff6495dd942cf" }
photocraft-codecs = { git = "https://github.com/harmony-contrib/photocraft.git", rev = "7dfa6098138eeb5a62e60184816ff6495dd942cf" }
photocraft-io = { git = "https://github.com/harmony-contrib/photocraft.git", rev = "7dfa6098138eeb5a62e60184816ff6495dd942cf" }
photocraft-format = { git = "https://github.com/harmony-contrib/photocraft.git", rev = "7dfa6098138eeb5a62e60184816ff6495dd942cf" }
photocraft-automation = { git = "https://github.com/harmony-contrib/photocraft.git", rev = "7dfa6098138eeb5a62e60184816ff6495dd942cf" }
pdfcraft-engine = { git = "https://github.com/harmony-contrib/pdfcraft.git", rev = "e9ff1527cf24b6957112c4e78653fec1bbed7ab7" }
pdfcraft-ui-egui = { git = "https://github.com/harmony-contrib/pdfcraft.git", rev = "e9ff1527cf24b6957112c4e78653fec1bbed7ab7" }
filmcraft-engine = { git = "https://github.com/harmony-contrib/filmcraft.git", rev = "1f1d40d9f1fd709aac5770748ec690e35aa4d4e5" }
filmcraft-ui-egui = { git = "https://github.com/harmony-contrib/filmcraft.git", rev = "1f1d40d9f1fd709aac5770748ec690e35aa4d4e5", default-features = false }
filmcraft-text = { git = "https://github.com/harmony-contrib/filmcraft.git", rev = "1f1d40d9f1fd709aac5770748ec690e35aa4d4e5" }
filmcraft-format = { git = "https://github.com/harmony-contrib/filmcraft.git", rev = "1f1d40d9f1fd709aac5770748ec690e35aa4d4e5" }
gridcraft-engine = { git = "https://github.com/harmony-contrib/gridcraft.git", rev = "6f453d75088395963168476baaee6cac62cc34e7" }
gridcraft-ui-egui = { git = "https://github.com/harmony-contrib/gridcraft.git", rev = "6f453d75088395963168476baaee6cac62cc34e7" }
effectcraft-engine = { git = "https://github.com/harmony-contrib/effectcraft.git", rev = "5ec943caaef2da303f57c131aa91b92d55ec6ba3" }
effectcraft-ui-egui = { git = "https://github.com/harmony-contrib/effectcraft.git", rev = "5ec943caaef2da303f57c131aa91b92d55ec6ba3", default-features = false }
effectcraft-host = { git = "https://github.com/harmony-contrib/effectcraft.git", rev = "5ec943caaef2da303f57c131aa91b92d55ec6ba3" }
designcraft-engine = { git = "https://github.com/harmony-contrib/designcraft.git", rev = "85f486339303f8f5fffe5e69399859cb922ecbd1" }
designcraft-ui-egui = { git = "https://github.com/harmony-contrib/designcraft.git", rev = "85f486339303f8f5fffe5e69399859cb922ecbd1", default-features = false }
designcraft-fonts = { git = "https://github.com/harmony-contrib/designcraft.git", rev = "85f486339303f8f5fffe5e69399859cb922ecbd1" }
serde = { version = "1", features = ["derive"] }
png = "0.18"
sys-locale = "0.3"
image = { version = "0.25", default-features = false }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "1a11a4897865f7410c40d25ca6e452ce399a1a2c" }
vectorcraft-engine = { git = "https://github.com/harmony-contrib/vectorcraft.git", rev = "13dd4d78880647a899602b683683e79c2479aa8f", default-features = false }
vectorcraft-ui-egui = { git = "https://github.com/harmony-contrib/vectorcraft.git", rev = "13dd4d78880647a899602b683683e79c2479aa8f" }
vectorcraft-text = { git = "https://github.com/harmony-contrib/vectorcraft.git", rev = "13dd4d78880647a899602b683683e79c2479aa8f", default-features = false }
vectorcraft-format = { git = "https://github.com/harmony-contrib/vectorcraft.git", rev = "13dd4d78880647a899602b683683e79c2479aa8f" }
egui = "0.37"
eframe = { version = "0.37", default-features = false }
log = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
socket2 = "0.6"
craft-font-catalog = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", default-features = false }
openharmony-ability = "=1.0.0-beta.5"
openharmony-ability-derive = "=1.0.0-beta.5"
openharmony-ability-plugin-clipboard = { version = "=1.0.0-beta.5", features = ["api-18"] }
napi-ohos = "=1.2.0"
napi-derive-ohos = "=1.2.0"
napi-build-ohos = "=1.2.0"
ohos-hilog-binding = { version = "0.2.3", features = ["log"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "extended-plugins"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

