[package]
name = "motrune-ability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Motrune HarmonyOS Ability, lifecycle and native editor services"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
default = []
ohos-control = []

[target.'cfg(target_env = "ohos")'.dependencies]
log = { workspace = true }
openharmony-ability = { workspace = true }
openharmony-ability-derive = { workspace = true }
napi-ohos = { workspace = true }
napi-derive-ohos = { workspace = true }

effectcraft-engine = { workspace = true }
effectcraft-ui-egui = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
craft-font-catalog = { workspace = true }
ohos-hilog-binding = { workspace = true }
winit = { workspace = true }
effectcraft-host = { workspace = true }
chrono = { workspace = true }
pollster = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "persistence", "default_fonts", "clipboard", "links"] }

[build-dependencies]
napi-build-ohos = { workspace = true }
