[package]
name = "modune-ability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Modune HarmonyOS Ability registration and native editor host"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
default = []

[target."cfg(target_env = \"ohos\")".dependencies]
craft-anything-engine = { workspace = true }
craft-anything-ui-egui = { workspace = true }
craft-anything-ai = { workspace = true }
craft-anything-setup = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "persistence", "default_fonts", "clipboard", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
ohos-hilog-binding = { workspace = true }
winit = { workspace = true }
log = { workspace = true }
openharmony-ability = { workspace = true }
openharmony-ability-derive = { workspace = true }
napi-ohos = { workspace = true }
napi-derive-ohos = { workspace = true }

[build-dependencies]
napi-build-ohos = { workspace = true }
