[package]
name = "pagrune-ability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Pagrune HarmonyOS Ability and native editor services"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
default = []
ohos-control = []

[target.'cfg(target_env = "ohos")'.dependencies]
log = { workspace = true }
openharmony-ability = { workspace = true }
openharmony-ability-derive = { workspace = true }
napi-ohos = { workspace = true }
napi-derive-ohos = { workspace = true }
pdfcraft-engine = { workspace = true }
pdfcraft-ui-egui = { workspace = true, features = ["unbranded"] }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
png = { workspace = true }
ohos-hilog-binding = { workspace = true }
winit = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "persistence", "default_fonts"] }

[build-dependencies]
napi-build-ohos = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
log = { workspace = true }
