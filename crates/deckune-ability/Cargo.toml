[package]
name = "deckune-ability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Deckune HarmonyOS Ability registration and native editor host"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
default = []

[target.'cfg(target_env = "ohos")'.dependencies]
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
deckcraft-fonts = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "persistence", "default_fonts", "clipboard", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
ohos-hilog-binding = { workspace = true }
winit = { workspace = true }
log = { workspace = true }
openharmony-ability = { workspace = true }
openharmony-ability-derive = { workspace = true }
napi-ohos = { workspace = true }
napi-derive-ohos = { workspace = true }

[build-dependencies]
napi-build-ohos = { workspace = true }
