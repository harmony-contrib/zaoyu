[package]
name = "cliprune-ability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Cliprune HarmonyOS Ability registration and native editor host"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
default = []

[target.'cfg(target_env = "ohos")'.dependencies]
filmcraft-engine = { workspace = true }
filmcraft-ui-egui = { workspace = true }
filmcraft-text = { workspace = true }
filmcraft-format = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "persistence", "default_fonts"] }
egui = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
sys-locale = { workspace = true }
image = { workspace = true, features = ["png"] }
craft-font-catalog = { workspace = true }
ohos-hilog-binding = { workspace = true }
winit = { workspace = true }
log = { workspace = true }
openharmony-ability = { workspace = true }
openharmony-ability-derive = { workspace = true }
napi-ohos = { workspace = true }
napi-derive-ohos = { workspace = true }

[build-dependencies]
napi-build-ohos = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
log = { workspace = true }
