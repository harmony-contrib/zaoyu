[package]
name = "vecrune-ability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Vecrune HarmonyOS application entry and native editor services"

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
default = []
ohos-control = []

[target.'cfg(target_env = "ohos")'.dependencies]
log = { workspace = true }
openharmony-ability = { workspace = true }
openharmony-ability-derive = { workspace = true }
napi-ohos = { workspace = true }
napi-derive-ohos = { workspace = true }

vectorcraft-engine = { workspace = true, features = ["bundled-fonts"] }
vectorcraft-ui-egui = { workspace = true }
vectorcraft-text = { workspace = true }
vectorcraft-format = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "persistence", "default_fonts"] }
egui = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
craft-font-catalog = { workspace = true }
openharmony-ability-plugin-clipboard = { workspace = true }
ohos-hilog-binding = { workspace = true }
winit = { workspace = true }

[build-dependencies]
napi-build-ohos = { workspace = true }

[target.'cfg(target_env = "ohos")'.dev-dependencies]
socket2 = { workspace = true }

[dev-dependencies]
log = { workspace = true }
chrono = { workspace = true }

[[test]]
name = "host_policy"
path = "src/host/ohos/policy.rs"
